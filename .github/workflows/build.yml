name: Build Unsigned IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate alarm.wav if missing
        run: |
          if [ ! -f "QuizAlarm/alarm.wav" ]; then
            python3 generate_alarm_wav.py
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned App
        run: |
          xcodebuild \
            -project QuizAlarm.xcodeproj \
            -scheme QuizAlarm \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/QuizAlarm.app Payload/
          zip -r9 QuizAlarm.ipa Payload

      - name: Upload QuizAlarm.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizAlarm-IPA
          path: QuizAlarm.ipa
          if-no-files-found: error
